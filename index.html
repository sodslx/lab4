<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR лабораторная</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script>
    // Журнал показывается только если открыть страницу со словом ?debug в конце ссылки
    const DEBUG = location.search.indexOf('debug') !== -1;
    function log(text) {
      if (!DEBUG) return;
      const el = document.getElementById('log');
      if (el) { el.style.display = 'block'; el.innerHTML += text + '<br>'; }
    }
    window.addEventListener('error', function (e) { log('JS-ошибка: ' + e.message); });

    // Габариты модели в системе координат самой сущности (не зависят от положения маркера)
    function localBox(entityObj, root) {
      root.updateMatrixWorld(true);
      const inv = new THREE.Matrix4().copy(entityObj.matrixWorld).invert();
      const box = new THREE.Box3();
      root.traverse(function (node) {
        if (node.geometry) {
          node.geometry.computeBoundingBox();
          const b = node.geometry.boundingBox.clone();
          b.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, node.matrixWorld));
          box.union(b);
        }
      });
      return box;
    }

    // Подгоняет модель под размер маркера и ставит её на маркер по центру
    AFRAME.registerComponent('fit-model', {
      schema: { size: { default: 1 } },
      init: function () {
        this.el.addEventListener('model-error', function () { log('модель: ОШИБКА загрузки'); });
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) { log('модель: нет mesh'); return; }
          const entityObj = this.el.object3D;

          const b1 = localBox(entityObj, root);
          const dim = b1.getSize(new THREE.Vector3());
          const max = Math.max(dim.x, dim.y, dim.z);
          log('размер модели: ' + dim.x.toFixed(2) + ' x ' + dim.y.toFixed(2) + ' x ' + dim.z.toFixed(2));
          if (!max) return;

          root.scale.multiplyScalar(this.data.size / max);
          const b2 = localBox(entityObj, root);
          const c = b2.getCenter(new THREE.Vector3());
          root.position.x -= c.x;
          root.position.z -= c.z;
          root.position.y -= b2.min.y;
          log('готово. Наведи камеру на маркер Hiro');
        });
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <div id="log" style="display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
       padding: 6px; font: 12px monospace; color: #fff; background: rgba(0,0,0,0.7);"></div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-marker preset="hiro">
      <a-entity
  gltf-model="url(model.glb)"
  fit-model="size: 1"
  rotation="-90 0 0">
</a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
