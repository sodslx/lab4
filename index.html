<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR лабораторная</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script>
    // Автоматически подгоняет модель под размер маркера и ставит её на маркер
    AFRAME.registerComponent('fit-model', {
      schema: { size: { default: 1 } },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;
          const box = new THREE.Box3().setFromObject(obj);
          const dim = box.getSize(new THREE.Vector3());
          const max = Math.max(dim.x, dim.y, dim.z);
          if (!max) return;
          obj.scale.multiplyScalar(this.data.size / max);
          const box2 = new THREE.Box3().setFromObject(obj);
          const c = box2.getCenter(new THREE.Vector3());
          obj.position.x -= c.x;
          obj.position.z -= c.z;
          obj.position.y -= box2.min.y;
        });
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
    <a-marker preset="hiro">
      <a-entity gltf-model="url(model.glb)" fit-model="size: 1"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
